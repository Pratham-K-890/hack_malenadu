services:
  - type: web
    name: hack-malenadu-api
    runtime: python
    rootDir: hack_malenadu
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn api.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: NODE_URL
        sync: false
      - key: PYTHON_VERSION
        value: "3.11"

  - type: web
    name: hack-malenadu-dashboard
    runtime: static
    rootDir: hack_malenadu/dashboard
    buildCommand: npm install && npm run build
    staticPublishPath: dist
    envVars:
      - key: VITE_API_URL
        sync: false
    routes:
      - type: rewrite
        source: /*
        destination: /index.html
